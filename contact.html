<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — AI Robotics</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="logo">🤖 AI ROBOTICS</div>
  <nav>
    <a href="x-series.html">X-Series</a>
    <a href="about.html">About</a>
    <a href="robots.html">Robots</a>
    <a href="medassist.html">MedAssist</a>
    <a href="research.html">Research</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<section>
  <h1><center>CONTACT US</center></h1>
  <p style="max-width:900px; margin:8px auto 18px;"><center>Fill the form and we'll get back to you</center></p>

  <form id="contact-form">
    <input type="text" name="name" placeholder="Your name" required />
    <input type="email" name="email" placeholder="Email address" required />
    <textarea name="message" placeholder="Message" required></textarea>
    <button class="btn" type="submit">Send Message</button>
  </form>
</section>
<footer>© 2025 AI Robotics Innovation</footer>

<script>
document.addEventListener("DOMContentLoaded", function(){
  // active nav
  const path = location.pathname.split("/").pop().toLowerCase() || "contact.html";
  document.querySelectorAll("nav a").forEach(a=>{
    if((a.getAttribute("href")||"").toLowerCase() === path) a.classList.add("active");
  });

  // form demo handler
  const form = document.getElementById("contact-form");
  if(form){
    form.addEventListener("submit", function(e){
      e.preventDefault();
      alert("Thanks — Message received we will get back to you");
      form.reset();
    });
  }
});
</script>

</body>
</html>
